<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: black;
      color: white;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #clock {
      font-size: 15vw;
      margin-bottom: 10px;
      letter-spacing: 5px;
    }
    #date {
      font-size: 3vw;
      margin-bottom: 20px;
    }
    button {
      position: absolute;
      top: 20px;
      right: 20px;
      background: black;
      color: white;
      border: 2px solid white;
      padding: 10px 20px;
      font-size: 1.2em;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
  </style>
</head>
<body>
  <button id="fullscreenBtn" onclick="toggleFullScreen()">Tam Ekran</button>
  <div id="date"></div>
  <div id="clock"></div>
  
  
  <script>
    function toggleFullScreen() {
      let elem = document.documentElement;
      if (!document.fullscreenElement) {
        elem.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // Tam ekran değiştiğinde buton metnini güncelle
    document.addEventListener("fullscreenchange", () => {
      let button = document.getElementById("fullscreenBtn");
      if (document.fullscreenElement) {
        button.textContent = "Tam Ekrandan Çık";
      } else {
        button.textContent = "Tam Ekran";
      }
    });

    function updateClockAndDate() {
      // Saat
      let timeOptions = {
        timeZone: 'Europe/Istanbul',
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      let timeFormatter = new Intl.DateTimeFormat('tr-TR', timeOptions);
      document.getElementById('clock').textContent = timeFormatter.format(new Date());

      // Tarih
      let dateOptions = {
        timeZone: 'Europe/Istanbul',
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      };
      let dateFormatter = new Intl.DateTimeFormat('tr-TR', dateOptions);
      document.getElementById('date').textContent = dateFormatter.format(new Date());
    }

    setInterval(updateClockAndDate, 1000);
    updateClockAndDate();
  </script>
</body>
</html>

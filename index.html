<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0b0f19;
            --text-color: #64ffda;
            --sub-color: #8892b0;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-border: rgba(255, 255, 255, 0.1);
        }

        /* Beyaz/Açık Tema Varsayılanları */
        body.light-theme {
            --bg-color: #f8f9fa;
            --text-color: #0f172a;
            --sub-color: #475569;
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-border: rgba(0, 0, 0, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            user-select: none;
            padding: 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .clock-container {
            text-align: center;
            width: 100%;
            max-width: 900px;
        }

        .time {
            font-size: clamp(3.5rem, 16vw, 10rem);
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .date {
            font-size: clamp(1rem, 4vw, 1.8rem);
            color: var(--sub-color);
            margin-top: 1.5rem;
            letter-spacing: 1px;
        }

        /* Kontrol Butonları Alanı */
        .controls {
            margin-top: 3rem;
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-color);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            border-color: var(--text-color);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .tag {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--sub-color);
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="time" id="time">00:00:00</div>
        <div class="date" id="date">-</div>

        <div class="controls">
            <button class="btn" id="fullscreen-btn" onclick="toggleFullscreen()">[ ⛶ Tam Ekran ]</button>
            <button class="btn" onclick="toggleSeconds()" id="sec-btn">Saniyeyi Gizle</button>
            <button class="btn" onclick="toggleTheme()" id="theme-btn">Açık Tema</button>
        </div>

        <div class="tag">// kuzeytunakale.github.io/saat</div>
    </div>

    <script>
        let showSeconds = true;

        function updateClock() {
            const now = new Date();

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const timeElement = document.getElementById('time');
            if (showSeconds) {
                timeElement.textContent = `${hours}:${minutes}:${seconds}`;
            } else {
                timeElement.textContent = `${hours}:${minutes}`;
            }

            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('tr-TR', options);
        }

        // Tam Ekran Kontrolü
        function toggleFullscreen() {
            const btn = document.getElementById('fullscreen-btn');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    btn.textContent = '[ ✕ Çıkış ]';
                }).catch(err => {
                    console.log(`Tam ekran hatası: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        btn.textContent = '[ ⛶ Tam Ekran ]';
                    });
                }
            }
        }

        // Saniye Aç/Kapat
        function toggleSeconds() {
            showSeconds = !showSeconds;
            document.getElementById('sec-btn').textContent = showSeconds ? "Saniyeyi Gizle" : "Saniyeyi Göster";
            updateClock();
        }

        // Tema Değiştirme
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('theme-btn');
            body.classList.toggle('light-theme');
            
            if (body.classList.contains('light-theme')) {
                themeBtn.textContent = "Koyu Tema";
            } else {
                themeBtn.textContent = "Açık Tema";
            }
        }

        // ESC ile tam ekrandan çıkıldığında buton yazısını güncelleme
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreen-btn');
            if (!document.fullscreenElement) {
                btn.textContent = '[ ⛶ Tam Ekran ]';
            }
        });

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>

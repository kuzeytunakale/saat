<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: black;
      color: white;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #clock {
      font-size: 6em;
      margin-bottom: 20px;
    }
    button {
      background: black;
      color: white;
      
      cursor: pointer;
    }
    :fullscreen {
      background: black;
    }
  </style>
</head>
<body>
  <div id="clock"></div>
  <button id="fullscreenBtn" onclick="toggleFullScreen()">Tam Ekran </button>

  <script>
    function toggleFullScreen() {
      var elem = document.documentElement;
      var button = document.getElementById("fullscreenBtn");

      if (!document.fullscreenElement) {
        elem.requestFullscreen();
        button.textContent = "Tam Ekrandan çık";
      } else {
        document.exitFullscreen();
        button.textContent = "Tam Ekran";
      }
    }

    function updateClock() {
      var options = {
        timeZone: 'Europe/Istanbul',
        hour12: false,
        hour: 'numeric',
        minute: 'numeric',
        second: 'numeric'
      };

      var formatter = new Intl.DateTimeFormat('tr-TR', options);
      var currentTime = formatter.format(new Date());
      document.getElementById('clock').textContent = currentTime;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>

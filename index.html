<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #64ffda;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* Mobil tarayıcı çubukları için */
            user-select: none;
            padding: 1rem;
        }

        .clock-container {
            text-align: center;
            width: 100%;
            max-width: 800px;
        }

        /* Akıcı tipografi: Ekran küçüldükçe saat fontu otomatik küçülür */
        .time {
            font-size: clamp(3.5rem, 15vw, 9rem);
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.2);
            line-height: 1;
        }

        .date {
            font-size: clamp(1rem, 4vw, 1.8rem);
            color: #8892b0;
            margin-top: 1.5rem;
            letter-spacing: 1px;
        }

        .tag {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: rgba(136, 146, 176, 0.4);
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="time" id="time">00:00:00</div>
        <div class="date" id="date">1 Ocak 2026, Perşembe</div>
        <div class="tag">// kuzeytunakale.github.io/saat</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            // Saat formatı (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

            // Türkçe tarih formatı
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('tr-TR', options);
        }

        // Anlık güncelleme
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>

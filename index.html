<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #64ffda;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            user-select: none;
            padding: 1rem;
            position: relative;
        }

        /* Sağ Üst Tam Ekran Butonu */
        .fullscreen-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #64ffda;
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .fullscreen-btn:hover {
            border-color: #64ffda;
            transform: scale(1.05);
        }

        .fullscreen-btn:active {
            transform: scale(0.98);
        }

        .clock-container {
            text-align: center;
            width: 100%;
            max-width: 900px;
        }

        .time {
            font-size: clamp(3.5rem, 16vw, 10rem);
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.15);
        }

        .date {
            font-size: clamp(1rem, 4vw, 1.8rem);
            color: #8892b0;
            margin-top: 1.5rem;
            letter-spacing: 1px;
        }

        .tag {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: #8892b0;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" id="fullscreen-btn" onclick="toggleFullscreen()">[ ⛶ ]</button>

    <div class="clock-container">
        <div class="time" id="time">00:00:00</div>
        <div class="date" id="date">-</div>
        <div class="tag">// kuzeytunakale.github.io/saat</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('tr-TR', options);
        }

        function toggleFullscreen() {
            const btn = document.getElementById('fullscreen-btn');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    btn.textContent = '[ ✕ ]';
                }).catch(err => {
                    console.log(`Tam ekran hatası: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        btn.textContent = '[ ⛶ ]';
                    });
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('fullscreen-btn');
            if (!document.fullscreenElement) {
                btn.textContent = '[ ⛶ ]';
            }
        });

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kuzey Tuna Kale - Kuzey Tuna Kale'nin sitesi">
  <meta name="keywords" content="Kuzey Tuna Kale, Kuzey, Tuna, Kale, yazılım, bilim, proje">
  <title>KTK Saat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: black;
      color: white;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #clock {
      font-size: 15vw;
      margin-bottom: 10px;
      letter-spacing: 5px;
    }
    #date {
      font-size: 3vw;
      margin-bottom: 20px;
    }
    .buttonc {
      position: absolute;
      top: 20px;
      right: 20px;
      background: black;
      color: white;
      border: 2px solid white;
      padding: 5px 10px;
      font-size: 0.9em;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

      .ao {
  position: absolute; /* Sayfa üzerinde konumu sabitler */
  top: 20px;          /* Üstten 20px boşluk */
  left: 20px;         /* Soldan 20px boşluk */
  background: black;  /* Arka plan siyah */
  color: white;       /* Yazı beyaz */
  border: 2px solid white; /* Beyaz çerçeve */
  padding: 5px 10px;  /* İç boşluk */
  font-size: 0.9em;   /* Yazı boyutu */
  border-radius: 8px; /* Köşeleri yuvarlatır */
  cursor: pointer;    /* Fare imleci değişir */
  transition: background 0.3s, color 0.3s; /* Renk geçişleri */
}
    .pp {
  position: absolute; /* Sayfa üzerinde konumu sabitler */
  top: 20px;          /* Üstten 20px boşluk */
  
  background: black;  /* Arka plan siyah */
  color: black;       /* Yazı beyaz */
      }
   
  </style>
</head>
<body>
  <button class="buttonc" id="fullscreenBtn" onclick="toggleFullScreen()">Tam Ekran</button>
  <a href="https://kuzeytunakale.github.io/LOTR"> <button class="ao"> Hobbit: Yalnız Dağ </button> </a>
  <h1> <mark class="pp"> <strong>Kuzey Tuna Kale</strong> </mark> </h1>
  <div id="date"></div>
  <div id="clock"></div>
  
  
  <script>
    function toggleFullScreen() {
      let elem = document.documentElement;
      if (!document.fullscreenElement) {
        elem.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // Tam ekran değiştiğinde buton metnini güncelle
    document.addEventListener("fullscreenchange", () => {
      let button = document.getElementById("fullscreenBtn");
      if (document.fullscreenElement) {
        button.textContent = "Tam Ekrandan Çık";
      } else {
        button.textContent = "Tam Ekran";
      }
    });

    function updateClockAndDate() {
      // Saat
      let timeOptions = {
        timeZone: 'Europe/Istanbul',
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      let timeFormatter = new Intl.DateTimeFormat('tr-TR', timeOptions);
      document.getElementById('clock').textContent = timeFormatter.format(new Date());

      // Tarih
      let dateOptions = {
        timeZone: 'Europe/Istanbul',
        weekday: 'long',
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      };
      let dateFormatter = new Intl.DateTimeFormat('tr-TR', dateOptions);
      document.getElementById('date').textContent = dateFormatter.format(new Date());
    }

    setInterval(updateClockAndDate, 1000);
    updateClockAndDate();
  </script>
</body>
</html>
